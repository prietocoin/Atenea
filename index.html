<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenea Panel - Gestión de Comprobantes</title>
  
  <!-- FAVICON IDENTIDAD OFICIAL logo.svg -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="shortcut icon" href="/logo.svg">
  
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[x-cloak] { display: none !important; }</style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { dark: '#0d0f1d', card: '#16192b', border: '#262a42', accent: '#8b5cf6' } }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0d19] text-slate-200 font-sans antialiased min-h-screen" x-data="app()" x-init="init()">

  <div class="flex flex-col md:flex-row min-h-screen">
    
    <!-- BARRA LATERAL NAV -->
    <aside class="w-full md:w-64 bg-[#111322] border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
      <div>
        <!-- LOGO OFICIAL SVG RESTAURADO -->
        <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
          <img src="/logo.svg" alt="Atenea Logo" class="w-10 h-10 rounded-xl border border-purple-500/40 object-contain bg-[#16192b] p-1 shadow-md">
          <div>
            <h1 class="font-extrabold text-white text-base tracking-wide">FUNDABLOCK</h1>
            <p class="text-[10px] text-purple-400 font-semibold uppercase tracking-wider">Atenea Panel v2.0</p>
          </div>
        </div>

        <nav class="space-y-1">
          <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Auditoría en Vivo</p>
          
          <button @click="vistaActiva = 'comprobantes'" :class="vistaActiva === 'comprobantes' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Comprobantes
          </button>

          <button @click="vistaActiva = 'tasas'" :class="vistaActiva === 'tasas' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Baúl & Cartelera Tasas
          </button>

          <button @click="vistaActiva = 'reportes'" :class="vistaActiva === 'reportes' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Reportes por Socio
          </button>

          <div class="pt-4">
            <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Base de Datos</p>
            <button @click="vistaActiva = 'directorio'" :class="vistaActiva === 'directorio' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
              <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Directorio (nombres_fb)
            </button>
          </div>
        </nav>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-3 md:p-6 overflow-x-hidden">
      
      <!-- VISTA COMPROBANTES -->
      <template x-if="vistaActiva === 'comprobantes'">
        <div class="space-y-4">
          
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h2 class="text-lg font-bold text-white tracking-wide">Gestión De Comprobantes & IA</h2>
            <div class="flex items-center gap-2">
              <button @click="cargarComprobantes()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700/60 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>
              <span class="px-2.5 py-1 rounded-xl bg-purple-900/40 text-purple-300 text-xs font-semibold border border-purple-500/30">
                <span x-text="comprobantes.length"></span> ítems
              </span>
            </div>
          </div>

          <!-- FILTROS -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-[#131525] p-2.5 rounded-xl border border-slate-800">
            <select x-model="filtroSocio" @change="cargarComprobantes()" class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none">
              <option value="">Todos los Socios</option>
              <template x-for="s in socios" :key="s">
                <option :value="s" x-text="s"></option>
              </template>
            </select>
            <input type="date" x-model="filtroFecha" @change="cargarComprobantes()" class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none" />
            <input type="text" x-model="filtroHash" @input.debounce.300ms="cargarComprobantes()" placeholder="Buscar Hash..." class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none" />
            <label class="flex items-center gap-2 px-2.5 py-1.5 bg-[#1a1d33] border border-slate-700/80 rounded-lg cursor-pointer text-xs text-slate-300">
              <input type="checkbox" x-model="soloDuplicados" @change="cargarComprobantes()" class="rounded bg-slate-800 border-slate-600 text-purple-600 focus:ring-purple-500">
              <span>Duplicados (>1)</span>
            </label>
          </div>

          <!-- 📱 VISTA MÓVIL: CARDS 30/70 -->
          <div class="grid grid-cols-1 gap-3 md:hidden">
            <template x-for="item in comprobantes" :key="item.hash_largo">
              <div class="flex flex-row bg-[#131525] border border-slate-800/90 rounded-2xl p-2.5 shadow-xl relative gap-3">
                <div class="w-[30%] shrink-0 flex flex-col gap-2">
                  <div class="relative aspect-square">
                    <img :src="item.url_imagen" class="w-full h-full object-cover rounded-xl border border-slate-700/60 bg-slate-900 shadow-sm" alt="Comprobante" @error="$event.target.src='https://via.placeholder.com/100?text=IMG'">
                    <a :href="item.url_imagen" target="_blank" class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity rounded-xl text-white backdrop-blur-sm">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    </a>
                  </div>
                  <div class="flex flex-col items-center gap-1">
                    <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 font-mono text-[9px] font-black border border-purple-500/30 truncate w-full text-center" x-text="item.hash_corto"></span>
                    <div class="flex items-center gap-1">
                      <span class="px-1 py-0.2 rounded bg-amber-500/20 text-amber-300 text-[8px] font-bold" x-text="'x' + item.conteo"></span>
                      <template x-if="item.procesado_ia">
                        <span class="px-1 py-0.2 rounded bg-emerald-500/20 text-emerald-300 text-[8px] font-bold">✓ IA</span>
                      </template>
                    </div>
                  </div>
                </div>

                <div class="w-[70%] flex flex-col justify-between">
                  <div class="flex items-start justify-between">
                    <div>
                      <p class="font-black text-emerald-400 text-sm leading-none" x-text="formatMonto(item.monto)"></p>
                      <p class="text-[9px] font-bold text-slate-400 mt-0.5" x-text="item.moneda || '---'"></p>
                    </div>
                    <template x-if="getCodigoOperativo(item.nombre_socio_1, item.moneda)">
                      <button @click="abrirModal(item)" :class="claseInsignia(getCodigoOperativo(item.nombre_socio_1, item.moneda))" class="px-2 py-0.5 rounded shadow border text-[10px] font-black uppercase active:scale-95 transition-transform">
                        <span x-text="getCodigoOperativo(item.nombre_socio_1, item.moneda)"></span>
                      </button>
                    </template>
                  </div>

                  <div class="grid grid-cols-2 gap-1 bg-[#1a1d33] p-1.5 rounded-lg border border-slate-800 my-1">
                    <div class="truncate">
                      <p class="text-[7px] font-extrabold text-purple-400 uppercase tracking-tighter">Socio 1</p>
                      <p class="text-[10px] font-bold text-purple-200 truncate" x-text="item.nombre_socio_1 || '-'"></p>
                    </div>
                    <div class="truncate border-l border-slate-800 pl-1">
                      <p class="text-[7px] font-extrabold text-pink-400 uppercase tracking-tighter">Socio 2</p>
                      <p class="text-[10px] font-bold text-pink-200 truncate" x-text="item.nombre_socio_2 || '-'"></p>
                    </div>
                  </div>

                  <div class="flex items-center justify-between text-[10px] bg-[#16182c] px-2 py-1 rounded border border-slate-800/60">
                    <span class="font-bold text-slate-400 uppercase truncate max-w-[45%]" x-text="item.banco || '-'"></span>
                    <span class="font-bold text-slate-200 uppercase truncate max-w-[50%]" x-text="obtenerPrimeraPalabra(item.titular)"></span>
                  </div>

                  <div class="flex items-center justify-between mt-1.5 pt-1 border-t border-slate-800/80">
                    <span class="font-mono text-[9px] text-slate-400 truncate max-w-[110px]">Ref: <span x-text="item.referencia || '-'"></span></span>
                    <button @click="abrirModal(item)" class="p-1 rounded bg-purple-600/20 text-purple-300 hover:bg-purple-600/40 active:scale-95 transition-all">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                    </button>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- 💻 VISTA ESCRITORIO: TABLA -->
          <div class="hidden md:block bg-[#131525] rounded-xl border border-slate-800 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead>
                  <tr class="text-slate-400 border-b border-slate-800 bg-[#171a2e] uppercase font-bold text-[10px] tracking-wider">
                    <th class="px-3 py-2.5">IMAGEN & R2</th>
                    <th class="px-3 py-2.5">HASH / ESTADO</th>
                    <th class="px-3 py-2.5">MONTO & MONEDA</th>
                    <th class="px-3 py-2.5">BANCO / TITULAR</th>
                    <th class="px-3 py-2.5">REFERENCIA</th>
                    <th class="px-3 py-2.5">SOCIOS (1 & 2)</th>
                    <th class="px-3 py-2.5">FECHA / HORA</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 font-medium text-[11px]">
                  <template x-for="item in comprobantes" :key="item.hash_largo">
                    <tr class="hover:bg-slate-800/30 transition-colors">
                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-1.5">
                          <img :src="item.url_imagen" class="w-8 h-8 object-cover rounded-lg border border-slate-700/60 bg-slate-900" alt="Comprobante">
                          <a :href="item.url_imagen" target="_blank" class="p-1 rounded bg-slate-800 text-slate-400 hover:text-white border border-slate-700">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                          </a>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-1">
                          <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 font-mono text-[10px] border border-purple-500/30 font-bold" x-text="item.hash_corto"></span>
                          <button @click="abrirModal(item)" class="p-1 rounded text-slate-400 hover:text-purple-300 hover:bg-purple-900/40 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                          </button>
                        </div>
                        <div class="flex items-center gap-1 mt-0.5">
                          <span class="px-1 py-0.2 rounded-full bg-amber-500/20 text-amber-300 text-[9px] font-bold" x-text="'x' + item.conteo"></span>
                          <template x-if="item.procesado_ia">
                            <span class="px-1 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 text-[9px] font-bold">✓ IA OK</span>
                          </template>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <span class="font-bold text-emerald-400 text-xs" x-text="formatMonto(item.monto) + ' ' + (item.moneda || '')"></span>
                      </td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <p class="font-bold text-slate-200 uppercase text-[11px]" x-text="item.banco || '-'"></p>
                        <p class="text-[9px] text-slate-400 uppercase font-semibold" x-text="obtenerPrimeraPalabra(item.titular)"></p>
                      </td>

                      <td class="px-3 py-2 align-middle font-mono text-slate-300 whitespace-nowrap text-[11px]" x-text="item.referencia || '-'"></td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-2">
                          <div class="flex flex-col">
                            <span class="font-bold text-purple-300 text-[11px]" x-text="item.nombre_socio_1 || '-'"></span>
                            <template x-if="item.nombre_socio_2">
                              <span class="font-bold text-pink-300 text-[11px]" x-text="item.nombre_socio_2"></span>
                            </template>
                          </div>

                          <template x-if="getCodigoOperativo(item.nombre_socio_1, item.moneda)">
                            <button @click="abrirModal(item)" :class="claseInsignia(getCodigoOperativo(item.nombre_socio_1, item.moneda))" class="px-1.5 py-0.2 rounded text-[9px] font-black border uppercase hover:opacity-80">
                              <span x-text="getCodigoOperativo(item.nombre_socio_1, item.moneda)"></span>
                            </button>
                          </template>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle text-slate-400 text-[10px] whitespace-nowrap" x-text="formatFecha(item.timestamp)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </template>

      <!-- VISTA: MÓDULO 2 (BAÚL DE TASAS EN VIVO DESDE /RADAR) -->
      <template x-if="vistaActiva === 'tasas'">
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-white tracking-wide">Baúl & Cartelera de Tasas</h2>
            <button 
              @click="consultarApiHoo()" 
              class="px-3.5 py-2 bg-purple-600/30 text-purple-300 border border-purple-500/50 rounded-xl text-xs font-bold hover:bg-purple-600/50 active:scale-95 transition-all flex items-center gap-2 shadow-lg">
              <span x-show="!cargandoTasas">🔄 Consultar API (Hoo)</span>
              <span x-show="cargandoTasas">Escaneando /radar...</span>
            </button>
          </div>

          <div class="bg-[#131525] p-4 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tasas Capturadas (Paso previo a Producción)</p>
              <template x-if="codigoTasaActual">
                <span class="px-2 py-0.5 bg-emerald-900/40 text-emerald-300 text-xs font-mono font-bold border border-emerald-500/30 rounded" x-text="'Lote: ' + codigoTasaActual"></span>
              </template>
            </div>

            <template x-if="Object.keys(tasasBaul).length === 0">
              <div class="text-center py-8 text-slate-500 text-xs font-medium">
                Haz clic en <strong class="text-purple-400">"Consultar API (Hoo)"</strong> para cargar en vivo las divisas del mercado desde /radar.
              </div>
            </template>

            <template x-if="Object.keys(tasasBaul).length > 0">
              <div class="space-y-4">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                  <template x-for="(valor, moneda) in tasasBaul" :key="moneda">
                    <div class="bg-[#1a1d33] p-2.5 rounded-xl border border-slate-700/60 flex flex-col justify-between">
                      <span class="text-[10px] font-extrabold text-purple-400 uppercase" x-text="moneda"></span>
                      <input type="number" step="any" x-model="tasasBaul[moneda]" class="w-full bg-transparent text-sm text-emerald-400 font-extrabold outline-none border-b border-slate-700/80 focus:border-purple-500 mt-1">
                    </div>
                  </template>
                </div>

                <div class="flex justify-end pt-2 border-t border-slate-800">
                  <button 
                    @click="publicarTasaOficial()" 
                    class="w-full sm:w-auto px-6 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-500 active:scale-95 transition-all shadow-lg shadow-emerald-900/40">
                    🚀 Publicar Tasa Oficial a Producción
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- MODAL AUDITORÍA -->
      <div x-show="modalAbierto" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm" x-cloak>
        <div class="bg-[#131525] border border-slate-700/80 rounded-2xl w-full max-w-md p-4 space-y-3 shadow-2xl relative" @click.away="modalAbierto = false">
          
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-white text-sm">Auditar Comprobante</h3>
              <span class="text-xs text-purple-400 font-mono font-bold bg-purple-900/30 px-1.5 rounded" x-text="itemEdicion ? itemEdicion.hash_corto : ''"></span>
            </div>
            <button @click="modalAbierto = false" class="text-slate-400 hover:text-white text-sm">✕</button>
          </div>

          <template x-if="itemEdicion">
            <div class="space-y-3">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Monto</label>
                  <input type="number" step="0.01" x-model="itemEdicion.monto" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-emerald-400 font-bold outline-none focus:border-purple-500">
                </div>
                
                <div x-data="{ openMoneda: false }" class="relative">
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Moneda</label>
                  <button type="button" @click="openMoneda = !openMoneda" @click.away="openMoneda = false" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white uppercase flex justify-between items-center outline-none hover:border-purple-500 transition-colors">
                    <span x-text="itemEdicion.moneda || 'Seleccionar'"></span>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                  <div x-show="openMoneda" class="absolute z-50 w-full mt-1 bg-[#1a1d33] border border-purple-500/50 rounded-lg shadow-xl max-h-40 overflow-y-auto" x-cloak>
                    <template x-for="m in listaMonedas" :key="m">
                      <div @click="itemEdicion.moneda = m; openMoneda = false; itemEdicion.tipo_manual = getCodigoOperativo(itemEdicion.nombre_socio_1, m)" class="px-3 py-2 text-xs text-white hover:bg-purple-600/40 cursor-pointer uppercase transition-colors" x-text="m"></div>
                    </template>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[9px] font-bold text-purple-400 uppercase mb-0.5">Socio 1</label>
                  <input type="text" x-model="itemEdicion.nombre_socio_1" @input="itemEdicion.tipo_manual = getCodigoOperativo(itemEdicion.nombre_socio_1, itemEdicion.moneda)" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-purple-200 uppercase outline-none focus:border-purple-500">
                </div>
                <div>
                  <label class="block text-[9px] font-bold text-pink-400 uppercase mb-0.5">Socio 2</label>
                  <input type="text" x-model="itemEdicion.nombre_socio_2" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-pink-200 uppercase outline-none focus:border-purple-500">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div x-data="{ openTipo: false }" class="relative">
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Tipo Operación</label>
                  <button type="button" @click="openTipo = !openTipo" @click.away="openTipo = false" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white uppercase flex justify-between items-center outline-none hover:border-purple-500 transition-colors">
                    <span :class="claseInsignia(itemEdicion.tipo_manual)" class="px-2 py-0.5 rounded text-[10px] font-black border uppercase" x-text="itemEdicion.tipo_manual || '-'"></span>
                    <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                  <div x-show="openTipo" class="absolute z-50 w-full mt-1 bg-[#1a1d33] border border-purple-500/50 rounded-lg shadow-xl overflow-hidden" x-cloak>
                    <template x-for="t in ['D', 'P', 'A', 'C']" :key="t">
                      <div @click="itemEdicion.tipo_manual = t; openTipo = false" class="px-3 py-2 text-xs text-white hover:bg-purple-600/40 cursor-pointer font-bold flex items-center justify-between">
                        <span :class="claseInsignia(t)" class="px-2 py-0.5 rounded text-[10px] font-black border uppercase" x-text="t"></span>
                      </div>
                    </template>
                  </div>
                </div>

                <div>
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Banco</label>
                  <input type="text" x-model="itemEdicion.banco" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white uppercase outline-none focus:border-purple-500">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Titular</label>
                  <input type="text" x-model="itemEdicion.titular" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white uppercase outline-none focus:border-purple-500">
                </div>
                <div>
                  <label class="block text-[9px] font-bold text-slate-400 uppercase mb-0.5">Referencia</label>
                  <input type="text" x-model="itemEdicion.referencia" class="w-full bg-[#1a1d33] border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none focus:border-purple-500 font-mono">
                </div>
              </div>

              <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                <button @click="eliminarComprobante(itemEdicion.hash_largo)" class="px-3 py-1.5 bg-rose-600/20 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold hover:bg-rose-600/40 active:scale-95 transition-all">Eliminar</button>
                <div class="flex gap-2">
                  <button @click="modalAbierto = false" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold">Cancelar</button>
                  <button @click="guardarCambios()" class="px-3.5 py-1.5 bg-purple-600 text-white rounded-lg text-xs font-bold hover:bg-purple-500 active:scale-95 transition-all shadow-lg shadow-purple-900/50">Guardar</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </main>
  </div>

  <script>
    function app() {
      return {
        vistaActiva: 'comprobantes',
        comprobantes: [],
        socios: [],
        directorio: [],
        filtroSocio: '',
        filtroFecha: '',
        filtroHash: '',
        soloDuplicados: true,
        modalAbierto: false,
        itemEdicion: null,

        // TASAS
        tasasBaul: {},
        cargandoTasas: false,
        codigoTasaActual: '',

        listaMonedas: [
          'USD', 'EUR', 'USDT', 'PEN', 'COP', 'CLP', 'ARS', 'MXN', 'BRL', 'VES',
          'PYG', 'DOP', 'CRC', 'CAD', 'ECU', 'PAN', 'BOB', 'UYU', 'GTQ', 'HNL',
          'NIO', 'PAB'
        ],

        metricas: { recibidos: 0, iaOk: 0, descartados: 0, duplicados: 0 },

        async init() {
          await this.cargarSocios();
          await this.cargarDirectorio();
          await this.cargarComprobantes();
        },

        async cargarComprobantes() {
          const params = new URLSearchParams();
          if (this.filtroSocio) params.append('socio', this.filtroSocio);
          if (this.filtroFecha) params.append('fechaInicio', this.filtroFecha);
          if (this.filtroHash) params.append('hash', this.filtroHash);
          if (this.soloDuplicados) params.append('soloDuplicados', 'true');

          try {
            const res = await fetch(`/api/comprobantes?${params.toString()}`);
            if (res.ok) {
              this.comprobantes = await res.json();
              this.calcularMetricas();
            }
          } catch (err) {
            console.error("Error al cargar comprobantes:", err);
          }
        },

        async cargarSocios() {
          try {
            const res = await fetch('/api/socios');
            if (res.ok) this.socios = (await res.json()).map(s => s.nombre);
          } catch (err) {
            console.error("Error al cargar socios:", err);
          }
        },

        async cargarDirectorio() {
          try {
            const res = await fetch('/api/directorio');
            if (res.ok) this.directorio = await res.json();
          } catch (err) {
            console.error("Error al cargar directorio:", err);
          }
        },

        async consultarApiHoo() {
          this.cargandoTasas = true;
          try {
            const res = await fetch('/api/tasas/fetch-hoo');
            if (res.ok) {
              const data = await res.json();
              this.tasasBaul = data.tasas || {};
            }
          } catch (err) {
            console.error("Error consultando /radar:", err);
          } finally {
            this.cargandoTasas = false;
          }
        },

        async publicarTasaOficial() {
          if (Object.keys(this.tasasBaul).length === 0) return;
          try {
            const res = await fetch('/api/tasas/publicar', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id_tasa: this.codigoTasaActual || null,
                tasas: this.tasasBaul
              })
            });
            if (res.ok) {
              const data = await res.json();
              this.codigoTasaActual = data.id_tasa;
              alert(`¡Tasa ${data.id_tasa} publicada a producción con éxito!`);
            }
          } catch (err) {
            console.error("Error publicando tasa:", err);
          }
        },

        getCodigoOperativo(nombreSocio, moneda) {
          if (!nombreSocio || !moneda || !this.directorio.length) return null;
          const socioNorm = nombreSocio.trim().toUpperCase();
          const monedaNorm = moneda.trim().toUpperCase();
          const registroSocio = this.directorio.find(d => d.nombre && d.nombre.trim().toUpperCase() === socioNorm);
          if (!registroSocio) return null;
          const codigo = registroSocio[monedaNorm] || registroSocio[monedaNorm.toLowerCase()];
          return codigo ? codigo.toUpperCase() : null;
        },

        claseInsignia(codigo) {
          if (!codigo) return 'hidden';
          const mapa = {
            'D': 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 shadow-cyan-900/50',
            'P': 'bg-amber-500/20 text-amber-300 border-amber-500/40 shadow-amber-900/50',
            'A': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 shadow-emerald-900/50',
            'C': 'bg-purple-500/20 text-purple-300 border-purple-500/40 shadow-purple-900/50'
          };
          return mapa[codigo] || 'bg-slate-500/20 text-slate-300 border-slate-500/40';
        },

        obtenerPrimeraPalabra(texto) {
          if (!texto) return '-';
          const str = String(texto).trim();
          if (!str) return '-';
          return str.split(/\s+/)[0];
        },

        calcularMetricas() {
          this.metricas.recibidos = this.comprobantes.length;
          this.metricas.iaOk = this.comprobantes.filter(c => c.procesado_ia).length;
          this.metricas.descartados = 0;
          this.metricas.duplicados = this.comprobantes.filter(c => c.conteo > 1).length;
        },

        abrirModal(item) {
          this.itemEdicion = { 
            ...item, 
            tipo_manual: this.getCodigoOperativo(item.nombre_socio_1, item.moneda) 
          };
          this.modalAbierto = true;
        },

        async guardarCambios() {
          try {
            const res = await fetch(`/api/comprobantes/${this.itemEdicion.hash_largo}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.itemEdicion)
            });
            if (res.ok) {
              this.modalAbierto = false;
              await this.cargarComprobantes();
            }
          } catch (err) {
            console.error("Error al guardar cambios:", err);
          }
        },

        async eliminarComprobante(hash_largo) {
          if (!confirm('¿Deseas eliminar este comprobante de la tabla maestra?')) return;
          try {
            const res = await fetch(`/api/comprobantes/${hash_largo}`, { method: 'DELETE' });
            if (res.ok) {
              this.modalAbierto = false;
              await this.cargarComprobantes();
            }
          } catch (err) {
            console.error("Error al eliminar comprobante:", err);
          }
        },

        formatMonto(val) {
          if (!val) return '0.00';
          return parseFloat(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        formatFecha(ts) {
          if (!ts) return '-';
          const date = new Date(ts * 1000);
          return `${date.getDate()}/${date.getMonth()+1}, ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
        }
      }
    }
  </script>
</body>
</html>
