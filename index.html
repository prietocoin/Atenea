<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenea Panel - Gestión de Comprobantes</title>
  
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="shortcut icon" href="/logo.svg">
  
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[x-cloak] { display: none !important; }</style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { dark: '#0d0f1d', card: '#16192b', border: '#262a42', accent: '#8b5cf6' } }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0d19] text-slate-200 font-sans antialiased min-h-screen" x-data="app()" x-init="init()">

  <div class="flex flex-col md:flex-row min-h-screen">
    
    <!-- BARRA LATERAL NAV -->
    <aside class="w-full md:w-64 bg-[#111322] border-r border-slate-800/80 p-4 flex flex-col justify-between shrink-0">
      <div>
        <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
          <div class="w-10 h-10 rounded-xl border border-purple-500/40 bg-[#16192b] p-1 flex items-center justify-center shadow-lg shrink-0">
            <img src="/logo.svg" alt="Fundablock Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=FB';">
          </div>
          <div>
            <h1 class="font-extrabold text-white text-base tracking-wide">FUNDABLOCK</h1>
            <p class="text-[10px] text-purple-400 font-semibold uppercase tracking-wider">Atenea Panel v2.0</p>
          </div>
        </div>

        <nav class="space-y-1">
          <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Auditoría en Vivo</p>
          
          <button @click="vistaActiva = 'comprobantes'" :class="vistaActiva === 'comprobantes' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Comprobantes
          </button>

          <button @click="vistaActiva = 'tasas'" :class="vistaActiva === 'tasas' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Baúl & Cartelera Tasas
          </button>

          <button @click="vistaActiva = 'reportes'" :class="vistaActiva === 'reportes' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Reportes por Socio
          </button>

          <div class="pt-4">
            <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Base de Datos</p>
            <button @click="vistaActiva = 'directorio'" :class="vistaActiva === 'directorio' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/50 shadow-lg' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all">
              <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Directorio (nombres_fb)
            </button>
          </div>
        </nav>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-3 md:p-6 overflow-x-hidden flex flex-col">
      
      <!-- VISTA COMPROBANTES -->
      <template x-if="vistaActiva === 'comprobantes'">
        <div class="space-y-4 flex-1 flex flex-col">
          
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 shrink-0">
            <h2 class="text-lg font-bold text-white tracking-wide">Gestión De Comprobantes & IA</h2>
            <div class="flex items-center gap-2">
              <button @click="cargarComprobantes()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700/60 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>
              <span class="px-2.5 py-1 rounded-xl bg-purple-900/40 text-purple-300 text-xs font-semibold border border-purple-500/30">
                <span x-text="comprobantes.length"></span> ítems
              </span>
            </div>
          </div>

          <!-- FILTROS -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-[#131525] p-2.5 rounded-xl border border-slate-800 shrink-0">
            <select x-model="filtroSocio" @change="cargarComprobantes()" class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none">
              <option value="">Todos los Socios</option>
              <template x-for="s in socios" :key="s">
                <option :value="s" x-text="s"></option>
              </template>
            </select>
            <input type="date" x-model="filtroFecha" @change="cargarComprobantes()" class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none" />
            <input type="text" x-model="filtroHash" @input.debounce.300ms="cargarComprobantes()" placeholder="Buscar Hash..." class="bg-[#1a1d33] border border-slate-700/80 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-purple-500 outline-none" />
            <label class="flex items-center gap-2 px-2.5 py-1.5 bg-[#1a1d33] border border-slate-700/80 rounded-lg cursor-pointer text-xs text-slate-300">
              <input type="checkbox" x-model="soloDuplicados" @change="cargarComprobantes()" class="rounded bg-slate-800 border-slate-600 text-purple-600 focus:ring-purple-500">
              <span>Duplicados (>1)</span>
            </label>
          </div>

          <!-- 📱 VISTA MÓVIL: CARDS OPTIMIZADO -->
          <div class="grid grid-cols-1 gap-3 md:hidden overflow-y-auto flex-1 pb-4">
            <template x-for="item in comprobantes" :key="item.hash_largo">
              <div class="flex flex-row bg-[#131525] border border-slate-800/90 rounded-2xl p-2.5 shadow-xl relative gap-3">
                
                <!-- IZQUIERDA: SOLO IMAGEN -->
                <div class="w-20 shrink-0 flex flex-col justify-start">
                  <div class="relative aspect-square">
                    <img :src="item.url_imagen" class="w-full h-full object-cover rounded-xl border border-slate-700/60 bg-slate-900 shadow-sm" alt="Comprobante" @error="$event.target.src='https://via.placeholder.com/100?text=IMG'">
                    <a :href="item.url_imagen" target="_blank" class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity rounded-xl text-white backdrop-blur-sm">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    </a>
                  </div>
                </div>

                <!-- DERECHA: INFORMACIÓN -->
                <div class="flex-1 flex flex-col min-w-0 justify-between gap-1.5">
                  
                  <!-- HASH ARRIBA Y TIPO/LOTE ARRIBA A LA DERECHA -->
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1">
                      <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 font-mono text-[10px] font-black border border-purple-500/30 truncate" x-text="item.hash_corto"></span>
                      <span class="px-1 py-0.2 rounded bg-amber-500/20 text-amber-300 text-[8px] font-bold" x-text="'x' + item.conteo"></span>
                      <template x-if="item.procesado_ia">
                        <span class="px-1 py-0.2 rounded bg-emerald-500/20 text-emerald-300 text-[8px] font-bold">✓ IA</span>
                      </template>
                    </div>

                    <!-- LOTE Y BADGE ÚNICO DE TIPO DE OPERACIÓN (TOP DERECHA) -->
                    <div class="flex items-center gap-1">
                      <template x-if="item.lote_tasa_asignado">
                        <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 text-[9px] font-mono font-bold border border-purple-500/30" x-text="item.lote_tasa_asignado"></span>
                      </template>
                      <template x-if="getCodigoOperativo(item.nombre_socio_1, item.moneda)">
                        <button @click="abrirModal(item)" :class="claseInsignia(getCodigoOperativo(item.nombre_socio_1, item.moneda))" class="px-1.5 py-0.5 rounded shadow border text-[9px] font-black uppercase active:scale-95 transition-transform">
                          <span x-text="getCodigoOperativo(item.nombre_socio_1, item.moneda)"></span>
                        </button>
                      </template>
                    </div>
                  </div>

                  <!-- MONTO Y MONEDA -->
                  <div class="flex items-end gap-1.5 truncate">
                    <span class="font-black text-emerald-400 text-sm leading-none" x-text="formatMonto(item.monto)"></span>
                    <span class="text-[9px] font-bold text-slate-400 mb-[1px]" x-text="item.moneda || '---'"></span>
                    <template x-if="item.monto_usd_equivalente">
                      <span class="text-[9px] font-bold text-emerald-300 mb-[1px] bg-emerald-950/60 px-1 rounded border border-emerald-500/30" x-text="'≈ $' + formatMonto(item.monto_usd_equivalente) + ' USD'"></span>
                    </template>
                  </div>

                  <!-- SOCIOS STACKED (Socio | Tasa | Monto M1/M2) -->
                  <div class="flex flex-col gap-1.5 bg-[#1a1d33] p-1.5 rounded-lg border border-slate-800">
                    
                    <!-- SOCIO 1 -->
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-1.5 truncate pr-1">
                        <span class="text-[10px] font-bold text-purple-200 truncate" x-text="item.nombre_socio_1 || '-'"></span>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <template x-if="item.tasa_1">
                          <span class="text-[8px] font-mono text-slate-400" x-text="'T1:' + item.tasa_1"></span>
                        </template>
                        <template x-if="item.m1 !== undefined">
                          <span class="text-[8px] font-black text-emerald-300 bg-emerald-950/60 px-1 rounded border border-emerald-500/30" x-text="'M1: $' + formatMonto(item.m1)"></span>
                        </template>
                      </div>
                    </div>

                    <!-- SOCIO 2 -->
                    <template x-if="item.nombre_socio_2">
                      <div class="flex items-center justify-between border-t border-slate-800/80 pt-1">
                        <div class="flex items-center gap-1.5 truncate pr-1">
                          <span class="text-[10px] font-bold text-pink-200 truncate" x-text="item.nombre_socio_2"></span>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                          <template x-if="item.tasa_2">
                            <span class="text-[8px] font-mono text-slate-400" x-text="'T2:' + item.tasa_2"></span>
                          </template>
                          <template x-if="item.m2 !== undefined">
                            <span class="text-[8px] font-black text-emerald-300 bg-emerald-950/60 px-1 rounded border border-emerald-500/30" x-text="'M2: $' + formatMonto(item.m2)"></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- BANCO Y REFERENCIA EN UNA LÍNEA -->
                  <div class="flex items-center justify-between mt-0.5">
                    <div class="flex flex-col min-w-0 max-w-[65%]">
                      <span class="font-bold text-slate-200 text-[9px] uppercase truncate" x-text="obtenerPrimeraPalabra(item.titular)"></span>
                      <span class="font-bold text-slate-500 uppercase truncate text-[8px]" x-text="item.banco || '-'"></span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="font-mono text-[9px] text-slate-400 truncate max-w-[80px]" x-text="item.referencia || '-'"></span>
                      <button @click="abrirModal(item)" class="p-1.5 rounded bg-purple-600/20 text-purple-300 hover:bg-purple-600/40 active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            </template>
          </div>

          <!-- 💻 VISTA ESCRITORIO: TABLA CON M1 Y M2 -->
          <div class="hidden md:flex flex-col bg-[#131525] rounded-xl border border-slate-800 overflow-hidden shadow-xl flex-1 max-h-[calc(100vh-170px)]">
            <div class="overflow-x-auto overflow-y-auto flex-1">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="sticky top-0 z-10 bg-[#171a2e] shadow-md border-b border-slate-800">
                  <tr class="text-slate-400 uppercase font-bold text-[10px] tracking-wider">
                    <th class="px-3 py-2.5">IMAGEN & R2</th>
                    <th class="px-3 py-2.5">HASH / ESTADO</th>
                    <th class="px-3 py-2.5">MONTO & MONEDA</th>
                    <th class="px-3 py-2.5">LOTE & TIPO</th>
                    <th class="px-3 py-2.5">BANCO / TITULAR</th>
                    <th class="px-3 py-2.5">REFERENCIA</th>
                    <th class="px-3 py-2.5">SOCIOS & TASAS (1 & 2)</th>
                    <th class="px-3 py-2.5">FECHA / HORA</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60 font-medium text-[11px]">
                  <template x-for="item in comprobantes" :key="item.hash_largo">
                    <tr class="hover:bg-slate-800/30 transition-colors">
                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-1.5">
                          <img :src="item.url_imagen" class="w-8 h-8 object-cover rounded-lg border border-slate-700/60 bg-slate-900" alt="Comprobante">
                          <a :href="item.url_imagen" target="_blank" class="p-1 rounded bg-slate-800 text-slate-400 hover:text-white border border-slate-700">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                          </a>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-1">
                          <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 font-mono text-[10px] border border-purple-500/30 font-bold" x-text="item.hash_corto"></span>
                          <button @click="abrirModal(item)" class="p-1 rounded text-slate-400 hover:text-purple-300 hover:bg-purple-900/40 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                          </button>
                        </div>
                        <div class="flex items-center gap-1 mt-0.5">
                          <span class="px-1 py-0.2 rounded-full bg-amber-500/20 text-amber-300 text-[9px] font-bold" x-text="'x' + item.conteo"></span>
                          <template x-if="item.procesado_ia">
                            <span class="px-1 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 text-[9px] font-bold">✓ IA OK</span>
                          </template>
                        </div>
                      </td>

                      <!-- MONTO, VOLUMEN USD E HISTORIAL TASA BASE DE CARTELERA -->
                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex flex-col">
                          <span class="font-bold text-emerald-400 text-xs" x-text="formatMonto(item.monto) + ' ' + (item.moneda || '')"></span>
                          <template x-if="item.monto_usd_equivalente">
                            <span class="text-[9px] font-bold text-slate-400" x-text="'≈ $' + formatMonto(item.monto_usd_equivalente) + ' USD'"></span>
                          </template>
                          <template x-if="item.tasa_base || item.tasa_mercado_aplicada">
                            <span class="text-[8px] font-mono text-slate-500 mt-0.5" x-text="'Base: ' + (item.tasa_base || item.tasa_mercado_aplicada)"></span>
                          </template>
                        </div>
                      </td>

                      <!-- LOTE Y TIPO DE OPERACIÓN -->
                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex items-center gap-1.5">
                          <template x-if="item.lote_tasa_asignado">
                            <span class="px-1.5 py-0.5 rounded bg-purple-900/40 text-purple-300 text-[10px] font-mono font-bold border border-purple-500/30" x-text="item.lote_tasa_asignado"></span>
                          </template>
                          <template x-if="getCodigoOperativo(item.nombre_socio_1, item.moneda)">
                            <button @click="abrirModal(item)" :class="claseInsignia(getCodigoOperativo(item.nombre_socio_1, item.moneda))" class="px-1.5 py-0.5 rounded text-[10px] font-black border uppercase hover:opacity-80">
                              <span x-text="getCodigoOperativo(item.nombre_socio_1, item.moneda)"></span>
                            </button>
                          </template>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <p class="font-bold text-slate-200 uppercase text-[11px]" x-text="item.banco || '-'"></p>
                        <p class="text-[9px] text-slate-400 uppercase font-semibold" x-text="obtenerPrimeraPalabra(item.titular)"></p>
                      </td>

                      <td class="px-3 py-2 align-middle font-mono text-slate-300 whitespace-nowrap text-[11px]" x-text="item.referencia || '-'"></td>

                      <!-- SOCIOS, TASAS Y MONTOS M1/M2 -->
                      <td class="px-3 py-2 align-middle whitespace-nowrap">
                        <div class="flex flex-col gap-1.5">
                          <!-- SOCIO 1 -->
                          <div class="flex flex-col">
                            <span class="font-bold text-purple-300 text-[11px]" x-text="item.nombre_socio_1 || '-'"></span>
                            <div class="flex items-center gap-1 text-[9px] font-mono mt-0.5">
                              <template x-if="item.tasa_1">
                                <span class="text-purple-400 font-bold" x-text="'T1: ' + item.tasa_1"></span>
                              </template>
                              <template x-if="item.m1 !== undefined">
                                <span class="text-emerald-300 font-black bg-purple-950/70 px-1 rounded border border-purple-500/30" x-text="'M1: $' + formatMonto(item.m1) + ' USDT'"></span>
                              </template>
                            </div>
                          </div>

                          <!-- SOCIO 2 -->
                          <template x-if="item.nombre_socio_2">
                            <div class="flex flex-col border-t border-slate-800/60 pt-1">
                              <span class="font-bold text-pink-300 text-[11px]" x-text="item.nombre_socio_2"></span>
                              <div class="flex items-center gap-1 text-[9px] font-mono mt-0.5">
                                <template x-if="item.tasa_2">
                                  <span class="text-pink-400 font-bold" x-text="'T2: ' + item.tasa_2"></span>
                                </template>
                                <template x-if="item.m2 !== undefined">
                                  <span class="text-emerald-300 font-black bg-pink-950/70 px-1 rounded border border-pink-500/30" x-text="'M2: $' + formatMonto(item.m2) + ' USDT'"></span>
                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </td>

                      <td class="px-3 py-2 align-middle text-slate-400 text-[10px] whitespace-nowrap" x-text="formatFecha(item.timestamp)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

        </div>

            <div>
              <label class="block text-[10px] font-bold text-purple-400 uppercase mb-1">Seleccionar Socio</label>
              <select x-model="nombreSocioAjuste" @change="cambiarSocioAjuste()" class="w-full bg-[#131525] border border-slate-700 text-xs text-white rounded-lg px-2.5 py-1.5 font-bold outline-none focus:border-purple-500">
                <template x-for="s in socios" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Filtrar Divisa</label>
              <input type="text" x-model="filtroMonedaAjustes" placeholder="Buscar ARS, PEN, COP..." class="w-full bg-[#131525] border border-slate-700 text-xs text-white rounded-lg px-2.5 py-1.5 outline-none focus:border-purple-500 uppercase">
            </div>
          </div>

          <!-- GRILLA DE VALORES EDITABLES -->
          <div class="overflow-y-auto flex-1 border border-slate-800 rounded-xl bg-[#111322] p-2 space-y-2">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <template x-for="m in listaMonedas.filter(mon => !filtroMonedaAjustes || mon.includes(filtroMonedaAjustes.toUpperCase()))" :key="m">
                <div class="bg-[#1a1d33] p-2.5 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                  <span class="font-black text-xs text-purple-300 w-12" x-text="m"></span>
                  <div class="flex items-center gap-2 flex-1">
                    <div class="flex-1">
                      <span class="block text-[8px] font-bold text-amber-400 uppercase">Pago (P)</span>
                      <input type="number" step="any" x-model.number="matrizEditSocio['P-' + m]" class="w-full bg-[#131525] border border-slate-700 text-xs text-amber-300 font-mono font-bold rounded px-1.5 py-1 outline-none focus:border-amber-500">
                    </div>
                    <div class="flex-1">
                      <span class="block text-[8px] font-bold text-cyan-400 uppercase">Depósito (D)</span>
                      <input type="number" step="any" x-model.number="matrizEditSocio['D-' + m]" class="w-full bg-[#131525] border border-slate-700 text-xs text-cyan-300 font-mono font-bold rounded px-1.5 py-1 outline-none focus:border-cyan-500">
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- PIE DE MODAL -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-800 shrink-0">
            <span class="text-[10px] text-slate-500">Socio activo: <strong class="text-white" x-text="nombreSocioAjuste"></strong></span>
            <div class="flex gap-2">
              <button @click="modalAjustesAbierto = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold hover:bg-slate-700">Cancelar</button>
              <button @click="guardarAjustesSocio()" :disabled="guardandoAjustes" class="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-purple-900/50 flex items-center gap-2">
                <span x-show="!guardandoAjustes">💾 Guardar Factores</span>
                <span x-show="guardandoAjustes">Guardando...</span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script>
    function app() {
      return {
        vistaActiva: 'comprobantes',
        comprobantes: [],
        socios: [],
        directorio: [],
        filtroSocio: '',
        filtroFecha: '',
        filtroHash: '',
        soloDuplicados: true,
        modalAbierto: false,
        itemEdicion: null,

        // EDITAR FACTORES DE AJUSTE
        modalAjustesAbierto: false,
        nombreSocioAjuste: '',
        matrizEditSocio: {},
        filtroMonedaAjustes: '',
        guardandoAjustes: false,

        // REPORTE POR SOCIO
        socioReporteSeleccionado: '',

        // TASAS
        tasasBaul: {},
        cargandoTasas: false,
        publicandoTasas: false,
        codigoTasaActual: '',
        mensajeTasas: '',
        notificacionTasas: { mostrar: false, tipo: '', mensaje: '' },

        listaMonedas: [
          'ARS', 'VES', 'PEN', 'COP', 'CLP', 'USD', 'USDT', 'EUR', 'BRL', 'MXN',
          'ECU', 'DOP', 'BOB', 'CRC', 'CAD', 'PYG', 'PYUSD'
        ],

        metricas: { recibidos: 0, iaOk: 0, descartados: 0, duplicados: 0 },

        async init() {
          await this.cargarSocios();
          await this.cargarDirectorio();
          await this.cargarComprobantes();
        },

        get comprobantesSocioReporte() {
          if (!this.socioReporteSeleccionado) return [];
          const s = this.socioReporteSeleccionado.trim().toUpperCase();
          return this.comprobantes.filter(c => 
            (c.nombre_socio_1 && c.nombre_socio_1.trim().toUpperCase() === s) ||
            (c.nombre_socio_2 && c.nombre_socio_2.trim().toUpperCase() === s)
          );
        },

        get totalUsdSocioReporte() {
          return this.comprobantesSocioReporte.reduce((acc, c) => acc + (parseFloat(c.monto_usd_equivalente) || 0), 0);
        },

        async cargarComprobantes() {
          const params = new URLSearchParams();
          if (this.filtroSocio) params.append('socio', this.filtroSocio);
          if (this.filtroFecha) params.append('fechaInicio', this.filtroFecha);
          if (this.filtroHash) params.append('hash', this.filtroHash);
          if (this.soloDuplicados) params.append('soloDuplicados', 'true');

          try {
            const res = await fetch(`/api/comprobantes?${params.toString()}`);
            if (res.ok) {
              this.comprobantes = await res.json();
              this.calcularMetricas();
            }
          } catch (err) {
            console.error("Error al cargar comprobantes:", err);
          }
        },

        async cargarSocios() {
          try {
            const res = await fetch('/api/socios');
            if (res.ok) this.socios = (await res.json()).map(s => s.nombre);
          } catch (err) {
            console.error("Error al cargar socios:", err);
          }
        },

        async cargarDirectorio() {
          try {
            const res = await fetch('/api/directorio');
            if (res.ok) this.directorio = await res.json();
          } catch (err) {
            console.error("Error al cargar directorio:", err);
          }
        },

        abrirModalAjustes(nombre = '') {
          this.nombreSocioAjuste = nombre || (this.socios[0] || '');
          this.cambiarSocioAjuste();
          this.modalAjustesAbierto = true;
        },

        cambiarSocioAjuste() {
          if (!this.nombreSocioAjuste) return;
          const socioNorm = this.nombreSocioAjuste.trim().toUpperCase();
          const reg = this.directorio.find(d => d.nombre && d.nombre.trim().toUpperCase() === socioNorm);
          
          let ex = {};
          if (reg && reg.ajustes) {
            ex = typeof reg.ajustes === 'string' ? JSON.parse(reg.ajustes) : reg.ajustes;
          }

          const temp = {};
          this.listaMonedas.forEach(m => {
            temp['P-' + m] = ex['P-' + m] !== undefined ? ex['P-' + m] : (ex[m] || 1.0);
            temp['D-' + m] = ex['D-' + m] !== undefined ? ex['D-' + m] : (ex[m] || 1.0);
          });
          this.matrizEditSocio = temp;
        },

        async guardarAjustesSocio() {
          if (!this.nombreSocioAjuste) return;
          this.guardandoAjustes = true;

          try {
            const res = await fetch('/api/socios/ajustes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                nombre: this.nombreSocioAjuste,
                ajustes: this.matrizEditSocio
              })
            });

            if (res.ok) {
              this.modalAjustesAbierto = false;
              await this.cargarDirectorio();
              await this.cargarComprobantes();
            } else {
              alert('Error al guardar ajustes.');
            }
          } catch (err) {
            console.error("Error al guardar factores:", err);
          } finally {
            this.guardandoAjustes = false;
          }
        },

        async consultarApiHoo() {
          this.cargandoTasas = true;
          this.mensajeTasas = 'Conectando con la API oficial de Hoo...';

          try {
            const res = await fetch('/api/tasas/fetch-hoo');
            const contentType = res.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
              throw new Error(`Servidor devolvió HTML (${res.status}). Revisa '/api/tasas/fetch-hoo' en server.js.`);
            }

            const data = await res.json();

            if (data && data.success && data.rates && Object.keys(data.rates).length > 0) {
              this.tasasBaul = data.rates;
              this.mensajeTasas = '';
            } else {
              this.mensajeTasas = 'El motor v4 de Hoo aún está inicializando sus datos.';
            }
          } catch (err) {
            console.error('Error al consultar la API:', err);
            this.mensajeTasas = `Error: ${err.message}`;
          } finally {
            this.cargandoTasas = false;
          }
        },

        async publicarTasaOficial() {
          if (Object.keys(this.tasasBaul).length === 0 || this.publicandoTasas) return;

          this.publicandoTasas = true;
          this.notificacionTasas = { mostrar: false, tipo: '', mensaje: '' };

          try {
            const res = await fetch('/api/tasas/publicar', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id_tasa: this.codigoTasaActual || null,
                tasas: this.tasasBaul
              })
            });

            const contentType = res.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
              throw new Error(`El servidor respondió con HTML (${res.status}). Revisa '/api/tasas/publicar' en server.js.`);
            }

            const data = await res.json();

            if (res.ok && data.success) {
              this.codigoTasaActual = data.id_tasa;
              this.notificacionTasas = {
                mostrar: true,
                tipo: 'exito',
                mensaje: `¡Lote ${data.id_tasa} publicado a producción con éxito!`
              };
              await this.cargarComprobantes();
            } else {
              this.notificacionTasas = {
                mostrar: true,
                tipo: 'error',
                mensaje: `Error en servidor: ${data.error || data.message || 'Fallo al guardar'}`
              };
            }
          } catch (err) {
            console.error("Error publicando tasa:", err);
            this.notificacionTasas = {
              mostrar: true,
              tipo: 'error',
              mensaje: `${err.message}`
            };
          } finally {
            this.publicandoTasas = false;
          }
        },

        getCodigoOperativo(nombreSocio, moneda) {
          if (!nombreSocio || !moneda || !this.directorio.length) return null;
          const socioNorm = nombreSocio.trim().toUpperCase();
          const monedaNorm = moneda.trim().toUpperCase();
          const registroSocio = this.directorio.find(d => d.nombre && d.nombre.trim().toUpperCase() === socioNorm);
          if (!registroSocio) return null;
          const codigo = registroSocio[monedaNorm] || registroSocio[monedaNorm.toLowerCase()];
          return codigo ? codigo.toUpperCase() : null;
        },

        claseInsignia(codigo) {
          if (!codigo) return 'hidden';
          const mapa = {
            'D': 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40 shadow-cyan-900/50',
            'P': 'bg-amber-500/20 text-amber-300 border-amber-500/40 shadow-amber-900/50',
            'A': 'bg-[#10b981]/20 text-emerald-300 border-emerald-500/40 shadow-emerald-900/50',
            'C': 'bg-purple-500/20 text-purple-300 border-purple-500/40 shadow-purple-900/50'
          };
          return mapa[codigo] || 'bg-slate-500/20 text-slate-300 border-slate-500/40';
        },

        obtenerPrimeraPalabra(texto) {
          if (!texto) return '-';
          const str = String(texto).trim();
          if (!str) return '-';
          return str.split(/\s+/)[0];
        },

        calcularMetricas() {
          this.metricas.recibidos = this.comprobantes.length;
          this.metricas.iaOk = this.comprobantes.filter(c => c.procesado_ia).length;
          this.metricas.descartados = 0;
          this.metricas.duplicados = this.comprobantes.filter(c => c.conteo > 1).length;
        },

        abrirModal(item) {
          this.itemEdicion = { 
            ...item, 
            tipo_manual: this.getCodigoOperativo(item.nombre_socio_1, item.moneda) 
          };
          this.modalAbierto = true;
        },

        async guardarCambios() {
          try {
            const res = await fetch(`/api/comprobantes/${this.itemEdicion.hash_largo}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.itemEdicion)
            });
            if (res.ok) {
              this.modalAbierto = false;
              await this.cargarComprobantes();
            }
          } catch (err) {
            console.error("Error al guardar cambios:", err);
          }
        },

        async eliminarComprobante(hash_largo) {
          if (!confirm('¿Deseas eliminar este comprobante de la tabla maestra?')) return;
          try {
            const res = await fetch(`/api/comprobantes/${hash_largo}`, { method: 'DELETE' });
            if (res.ok) {
              this.modalAbierto = false;
              await this.cargarComprobantes();
            }
          } catch (err) {
            console.error("Error al eliminar comprobante:", err);
          }
        },

        formatMonto(val) {
          if (val === null || val === undefined || isNaN(val)) return '0.00';
          return parseFloat(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        formatFecha(ts) {
          if (!ts) return '-';
          const date = new Date(ts * 1000);
          return `${date.getDate()}/${date.getMonth()+1}, ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
        }
      };
    }
  </script>
</body>
</html>
